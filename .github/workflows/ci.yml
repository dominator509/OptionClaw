name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Typecheck
        run: cargo check --all-targets --all-features
      - name: Unit tests
        run: cargo test --lib --bins --all-features
      - name: Integration tests
        run: cargo test --test integration_smoke --all-features
      - name: E2E tests
        run: cargo test --test e2e_cli --all-features
      - name: Build
        run: cargo build --release
      - name: Smoke check help
        run: cargo run -- --help
      - name: Smoke check config
        run: cargo run -- check-config --config config/example.toml
