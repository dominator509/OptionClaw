project_name: "OptionClaw"
languages:
  - rust
encoding: "utf-8"
line_ending:
language_backend: LSP
ignore_all_files_in_gitignore: true
ls_specific_settings: {}
additional_workspace_folders: []
ignored_paths:
  - target/
  - var/
  - .cargo/
  - .serena/cache/
  - .serena/memories/
  - .codex/
  - .idea/
  - .vscode/
  - "*.log"
  - "*.rs.bk"
read_only: false
excluded_tools: []
included_optional_tools: []
fixed_tools: []
default_modes: []
added_modes: []
initial_prompt: "Use REPO_BRIEF.md for compact repo context. Keep searches focused; do not index generated artifacts, local state, caches, or IDE/tool metadata."
symbol_info_budget:
read_only_memory_patterns: []
ignored_memory_patterns: []
